# Render deployment configuration for PolicyPilot Backend
# Free tier: https://render.com

services:
  - type: web
    name: policypilot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONPATH
        value: "/opt/render/project/src"
    plan: free  # Free tier
